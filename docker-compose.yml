version: "3.8"

services:
  # ─── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: totus-db
    environment:
      POSTGRES_USER: totus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-totus_dev_password}
      POSTGRES_DB: totus_telehealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgcrypto.sql:/docker-entrypoint-initdb.d/init-pgcrypto.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totus -d totus_telehealth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Next.js App ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: totus-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://totus:${DB_PASSWORD:-totus_dev_password}@postgres:5432/totus_telehealth
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_URL: https://${DOMAIN:-localhost:3000}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_URL: http://livekit:7880
      NEXT_PUBLIC_LIVEKIT_URL: wss://${DOMAIN:-localhost}:7880
      NEXT_PUBLIC_APP_URL: https://${DOMAIN:-localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── LiveKit Server (SFU) ─────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    container_name: totus-livekit
    ports:
      - "7880:7880"   # WebRTC / WebSocket
      - "7881:7881"   # TURN/UDP
      - "7882:7882"   # TURN/TCP
      - "7883:7883"   # RTC
      - "7884:7884"   # RTC
      - "7885:7885"   # RTC
      - "7886:7886"   # RTC
      - "7887:7887"   # RTC
      - "7888:7888"   # RTC
      - "7889:7889"   # RTC
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml
      - livekit_data:/var/lib/livekit
    restart: unless-stopped

  # ─── Redis (for rate limiting / sessions) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: totus-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
  livekit_data:
