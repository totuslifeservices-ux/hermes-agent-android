# ── Hermes Agent for Android ──────────────────────────────────────────────
# Project-wide Gradle settings.

# AndroidX + Compose
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g

# Compose compiler (Kotlin 2.0+ — no need for separate compose-compiler)
kotlin.plugin.compose.enabled=true

# Gradle
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Hermes Agent specific
HERMES_APP_VERSION=0.18.2
HERMES_APP_VERSION_CODE=1
HERMES_MIN_SDK=26
HERMES_TARGET_SDK=36
HERMES_COMPILE_SDK=36
