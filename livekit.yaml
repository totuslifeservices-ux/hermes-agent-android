# LiveKit Server Configuration
# Totus Telehealth — Canadian-hosted, E2EE video conferencing

port: 7880
bind_addresses:
  - "0.0.0.0"
  - "::"

rtc:
  port_range_start: 7883
  port_range_end: 7889
  use_external_ip: true
  force_tcp: false
  congestion_control:
    enabled: true

turn:
  enabled: true
  domain: ${DOMAIN:localhost}
  tls_port: 7881
  udp_port: 7882

webhook:
  api_key: ${LIVEKIT_API_KEY:-devkey}
  urls:
    - http://app:3000/api/webhooks/livekit

keys:
  ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}

logging:
  level: info
  format: json

# E2EE is configured client-side in the browser
# The server routes encrypted packets without decryption
room:
  max_participants: 50
  empty_timeout: 300
  enabled_codecs:
    - mime: video/vp8
    - mime: video/h264
    - mime: video/av1
    - mime: audio/opus

redis:
  address: redis:6379
